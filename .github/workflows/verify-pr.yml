name: Verify PR

on:
  pull_request:
  push:
    branches: [main]

env:
  CI: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    concurrency:
      group: verify-pr-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Node version
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: |
          yarn config set enableGlobalCache false
          yarn --immutable

      - name: Check yarn constraints
        run: yarn constraints

      - name: Save Yarn cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Check format
        run: yarn format:check

      - name: Check linting
        run: yarn lint

      - name: Check for dead code
        run: yarn deadcode

      - name: Test types
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Test site deployment selection and promotion safety
        run: node --test apps/site/deployment/*.test.mjs

      - name: Test Codex review gate
        run: node --test tests/automation/codex-review-gate.test.cjs

      - name: Test maintainer approval gate
        run: node --test tests/automation/maintainer-approval-gate.test.cjs

      - name: Build
        run: yarn build

      - name: Smoke test the packed tarball
        run: yarn smoke

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Node version
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache/restore@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: |
          yarn config set enableGlobalCache false
          yarn --immutable

      - name: Typecheck and build the site
        run: yarn workspace @mdxserve/site build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Node version
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache/restore@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: |
          yarn config set enableGlobalCache false
          yarn --immutable

      - name: Typecheck the app
        run: yarn mobile typecheck

      # EXPO_OFFLINE makes the version check compare against the installed expo package's own
      # pins (expo/bundledNativeModules.json), not the newest SDK patch on Expo's API. A mismatch
      # with the SDK we pin still fails; a new Expo patch release alone does not.
      - name: Check the app with Expo Doctor
        run: yarn mobile doctor
        env:
          EXPO_OFFLINE: 1

      # Proves Metro can resolve and bundle the whole graph from the workspace.
      - name: Bundle the app for iOS
        run: yarn mobile expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-export"

      - name: Test the app
        run: yarn mobile test
