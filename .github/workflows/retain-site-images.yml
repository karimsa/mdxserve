name: Retain site images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["Site deployment signal", "Release"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: site-production
  cancel-in-progress: false
  queue: max

jobs:
  retain:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.name == 'Release' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Retain production and newest other image
        run: node site/deployment/retain-images.mjs --apply
